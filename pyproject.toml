[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "EduNet"
version = "0.1.0"
description = "A from-scratch, educational neural network library with an interactive training visualizer"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
visualizer = ["matplotlib>=3.5"]
data = ["pandas>=1.5"]
full = ["matplotlib>=3.5", "pandas>=1.5"]

[tool.setuptools.packages.find]
include = ["EduNet*"]
